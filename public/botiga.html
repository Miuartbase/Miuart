<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miuart - Tienda en Construcción</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcfcfc;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            max-width: 400px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #2c3e50;
            letter-spacing: 2px;
        }
        .status {
            display: inline-block;
            padding: 5px 15px;
            background-color: #fff3cd;
            color: #856404;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        p {
            line-height: 1.6;
            color: #666;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Miuart</h1>
        <div class="status">PRÓXIMAMENTE</div>
        <p><strong>Tienda Online en construcción.</strong></p>
        <p>Estamos trabajando para ofrecerte la mejor experiencia artística. Disculpen las molestias.</p>
        
        <div class="footer">
            &copy; 2025 Miuart
        </div>
    </div>

</body>
</html>
